<!doctype html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18181b">
    <title>Offline - YouTube Autoposter</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; background: #18181b; color: #f4f4f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
        img { width: 96px; height: 96px; border-radius: 20px; }
        p { margin: 0; color: #a1a1aa; max-width: 320px; }
        button { padding: 10px 20px; border: 0; border-radius: 8px; background: #7c3aed; color: #fff; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>

    <button onclick="location.reload()">Try again</button>

</html>
